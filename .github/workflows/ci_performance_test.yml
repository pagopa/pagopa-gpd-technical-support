name: Reconciliation Performance Tests

# Final execution mode:
# - workflow_dispatch: manual execution from the Actions page after this
#   workflow exists on the default branch.
#
# Feature-branch test mode:
# - add the "run-performance-test" label to the pull request;
# - the workflow runs only when that label is explicitly added;
# - it uses the safe FEATURE_TEST_* values declared below.
#
# Before merging, the pull_request trigger and FEATURE_TEST_* values may be
# removed if only the standard Run workflow button should remain.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - uat

      test_day:
        description: Processing day in YYYY-MM-DD format
        required: true
        type: string

      positions_to_create:
        description: Number of debt positions to create (3-1000000)
        required: true
        type: string
        default: "10000"

      execution_mode:
        description: Execution mode
        required: true
        type: choice
        default: full
        options:
          - full
          - prepare-only
          - skip-prepare

      allow_full_day_purge:
        description: >-
          Delete all unrelated reconciliation candidates found on TEST_DAY.
          WARNING: complete APD payment-position graphs may be removed.
        required: true
        type: boolean
        default: false

      upload_log_artifact:
        description: Upload the complete execution log as a seven-day artifact
        required: true
        type: boolean
        default: false

  # Temporary, on-demand trigger used to test this workflow before it reaches
  # the default branch. It does not run on push, PR creation, or synchronization.
  # Add the "run-performance-test" label to the PR to request an execution.
  pull_request:
    branches:
      - main
    types:
      - labeled

# Safe values used only when the workflow is requested through the PR label.
# Update FEATURE_TEST_DAY before adding the label.
env:
  FEATURE_TEST_ENVIRONMENT: dev
  FEATURE_TEST_DAY: "2026-07-13"
  FEATURE_TEST_POSITIONS_TO_CREATE: "10"
  FEATURE_TEST_EXECUTION_MODE: full
  FEATURE_TEST_ALLOW_FULL_DAY_PURGE: "false"
  FEATURE_TEST_UPLOAD_LOG_ARTIFACT: "false"

permissions:
  contents: read

concurrency:
  group: >-
    gpd-reconciliation-performance-${{
      github.event_name == 'workflow_dispatch' &&
      inputs.environment ||
      'dev'
    }}
  cancel-in-progress: false

jobs:
  performance_test:
    # The workflow is requested manually either through workflow_dispatch or
    # by explicitly adding the dedicated label to the pull request.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'run-performance-test'
        )
      }}

    name: >-
      Performance test - ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment ||
        'dev'
      }}

    runs-on:
      - self-hosted-job
      - >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.environment ||
          'dev'
        }}

    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment ||
        'dev'
      }}

    # A one-million-position workflow can take many hours.
    # The infrastructure hosting the self-hosted runner must have a timeout
    # compatible with this value.
    timeout-minutes: 2160

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
        with:
          persist-credentials: false
          # For label-based testing, execute the exact PR head revision rather
          # than the synthetic pull-request merge commit.
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}

      - name: Resolve execution parameters
        shell: bash
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          DISPATCH_TEST_DAY: ${{ inputs.test_day }}
          DISPATCH_POSITIONS_TO_CREATE: ${{ inputs.positions_to_create }}
          DISPATCH_EXECUTION_MODE: ${{ inputs.execution_mode }}
          DISPATCH_ALLOW_FULL_DAY_PURGE: ${{ inputs.allow_full_day_purge }}
          DISPATCH_UPLOAD_LOG_ARTIFACT: ${{ inputs.upload_log_artifact }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            trigger_mode="workflow_dispatch"
            environment="$DISPATCH_ENVIRONMENT"
            test_day="$DISPATCH_TEST_DAY"
            positions_to_create="$DISPATCH_POSITIONS_TO_CREATE"
            execution_mode="$DISPATCH_EXECUTION_MODE"
            allow_full_day_purge="$DISPATCH_ALLOW_FULL_DAY_PURGE"
            upload_log_artifact="$DISPATCH_UPLOAD_LOG_ARTIFACT"
          else
            trigger_mode="pull_request_label"
            environment="$FEATURE_TEST_ENVIRONMENT"
            test_day="$FEATURE_TEST_DAY"
            positions_to_create="$FEATURE_TEST_POSITIONS_TO_CREATE"
            execution_mode="$FEATURE_TEST_EXECUTION_MODE"
            allow_full_day_purge="$FEATURE_TEST_ALLOW_FULL_DAY_PURGE"
            upload_log_artifact="$FEATURE_TEST_UPLOAD_LOG_ARTIFACT"

            echo "::notice title=Feature-branch performance test::Using the safe FEATURE_TEST_* values declared in the workflow."
          fi

          {
            echo "TRIGGER_MODE=$trigger_mode"
            echo "ENVIRONMENT=$environment"
            echo "TEST_DAY=$test_day"
            echo "POSITIONS_TO_CREATE=$positions_to_create"
            echo "EXECUTION_MODE=$execution_mode"
            echo "ALLOW_FULL_DAY_PURGE=$allow_full_day_purge"
            echo "UPLOAD_LOG_ARTIFACT=$upload_log_artifact"
          } >> "$GITHUB_ENV"

          echo "Resolved execution parameters:"
          echo "  TRIGGER_MODE=$trigger_mode"
          echo "  ENVIRONMENT=$environment"
          echo "  TEST_DAY=$test_day"
          echo "  POSITIONS_TO_CREATE=$positions_to_create"
          echo "  EXECUTION_MODE=$execution_mode"
          echo "  ALLOW_FULL_DAY_PURGE=$allow_full_day_purge"
          echo "  UPLOAD_LOG_ARTIFACT=$upload_log_artifact"

      - name: Validate runner prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail

          command -v bash >/dev/null \
            || {
              echo "ERROR: bash is not installed"
              exit 1
            }

          command -v docker >/dev/null \
            || {
              echo "ERROR: Docker CLI is not installed"
              exit 1
            }

          docker info >/dev/null \
            || {
              echo "ERROR: the runner cannot connect to a Docker daemon."
              echo "The performance-test framework requires Docker Engine."
              exit 1
            }

          docker compose version

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$ENVIRONMENT" =~ ^(dev|uat)$ ]] \
            || {
              echo "ERROR: ENVIRONMENT must be dev or uat."
              exit 1
            }

          [[ "$TEST_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || {
              echo "ERROR: TEST_DAY must use YYYY-MM-DD format."
              exit 1
            }

          normalized_test_day="$(
            date -d "$TEST_DAY" +%F 2>/dev/null
          )" || {
            echo "ERROR: TEST_DAY is not a valid calendar date."
            exit 1
          }

          [[ "$normalized_test_day" == "$TEST_DAY" ]] \
            || {
              echo "ERROR: TEST_DAY is not a valid calendar date."
              exit 1
            }

          [[ "$POSITIONS_TO_CREATE" =~ ^[1-9][0-9]*$ ]] \
            || {
              echo "ERROR: POSITIONS_TO_CREATE must be a positive integer."
              exit 1
            }

          (( POSITIONS_TO_CREATE >= 3 )) \
            || {
              echo "ERROR: POSITIONS_TO_CREATE must be at least 3."
              exit 1
            }

          (( POSITIONS_TO_CREATE <= 1000000 )) \
            || {
              echo "ERROR: POSITIONS_TO_CREATE cannot be greater than 1000000."
              exit 1
            }

          case "$EXECUTION_MODE" in
            full|prepare-only|skip-prepare)
              ;;
            *)
              echo "ERROR: unsupported execution mode: $EXECUTION_MODE"
              exit 1
              ;;
          esac

          [[
            "$ALLOW_FULL_DAY_PURGE" == "true" ||
            "$ALLOW_FULL_DAY_PURGE" == "false"
          ]] || {
            echo "ERROR: ALLOW_FULL_DAY_PURGE must be true or false."
            exit 1
          }

          [[
            "$UPLOAD_LOG_ARTIFACT" == "true" ||
            "$UPLOAD_LOG_ARTIFACT" == "false"
          ]] || {
            echo "ERROR: UPLOAD_LOG_ARTIFACT must be true or false."
            exit 1
          }

          if [[
            "$EXECUTION_MODE" == "skip-prepare" &&
            "$ALLOW_FULL_DAY_PURGE" == "true"
          ]]; then
            echo "ERROR: allow_full_day_purge cannot be used with skip-prepare."
            exit 1
          fi

      - name: Warn about full-day purge
        if: ${{ env.ALLOW_FULL_DAY_PURGE == 'true' }}
        shell: bash
        run: |
          echo "::warning title=Full-day APD purge enabled::The workflow was explicitly started with full-day purge enabled for ENVIRONMENT=${ENVIRONMENT}, TEST_DAY=${TEST_DAY}. All unrelated reconciliation candidate graphs found on that day may be deleted."

      - name: Normalize script line endings and permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          find performance-test \
            -type f \
            -name '*.sh' \
            -exec sed -i 's/\r$//' {} +

          chmod +x \
            performance-test/run_performance_test.sh \
            performance-test/run_local_apd_safety_test.sh \
            performance-test/src/data-preparation/apd/prepare-test-day.sh \
            performance-test/src/data-validation/apd/validate-reconciliation-result.sh

      - name: Run reconciliation performance test
        id: run_performance_test
        shell: bash
        env:
          API_SUBSCRIPTION_KEY: ${{ secrets.API_SUBSCRIPTION_KEY }}
          APD_PASSWORD: ${{ secrets.APD_PASSWORD }}
          BIZ_COSMOS_KEY: ${{ secrets.BIZ_COSMOS_KEY }}
          RECONCILIATION_COSMOS_KEY: ${{ secrets.RECONCILIATION_COSMOS_KEY }}
        run: |
          set -Eeuo pipefail

          cd performance-test

          arguments=(
            "ENVIRONMENT=${ENVIRONMENT}"
            "TEST_DAY=${TEST_DAY}"
            "POSITIONS_TO_CREATE=${POSITIONS_TO_CREATE}"
          )

          case "$EXECUTION_MODE" in
            full)
              ;;
            prepare-only)
              arguments+=("--prepare-only")
              ;;
            skip-prepare)
              arguments+=("--skip-prepare")
              ;;
          esac

          if [[ "$ALLOW_FULL_DAY_PURGE" == "true" ]]; then
            echo "WARNING: --allow-full-day-purge was explicitly enabled."
            arguments+=("--allow-full-day-purge")
          fi

          ./run_performance_test.sh "${arguments[@]}" \
            2>&1 | tee performance-test.log

      - name: Write execution summary
        if: ${{ always() }}
        shell: bash
        run: |
          set +u

          {
            echo "## Reconciliation performance test"
            echo
            echo "- Trigger mode: \`${TRIGGER_MODE:-not-resolved}\`"
            echo "- Environment: \`${ENVIRONMENT:-not-resolved}\`"
            echo "- Test day: \`${TEST_DAY:-not-resolved}\`"
            echo "- Positions: \`${POSITIONS_TO_CREATE:-not-resolved}\`"
            echo "- Execution mode: \`${EXECUTION_MODE:-not-resolved}\`"
            echo "- Full-day purge: \`${ALLOW_FULL_DAY_PURGE:-not-resolved}\`"
            echo "- Log artifact requested: \`${UPLOAD_LOG_ARTIFACT:-not-resolved}\`"
            echo "- Started by: \`${GITHUB_ACTOR}\`"
            echo

            if [[ -f performance-test/performance-test.log ]]; then
              echo "### Relevant output"
              echo
              echo '```text'

              grep -E \
                'RECONCILIATION_TRIGGER status=|EXECUTION_ID=|STATUS=|RECOVERED=|MANUAL_REQUIRED=|TECHNICAL_FAILURES=|DURATION_MS=|REQUEST_CHARGE=|APD_SEED_VALIDATION_PASSED|BIZ_SEED_VALIDATION_PASSED|RECONCILIATION_COSMOS_VALIDATION_PASSED|APD_RECONCILIATION_VALIDATION_PASSED|PERFORMANCE_WORKFLOW_VALIDATION_PASSED|^ERROR:' \
                performance-test/performance-test.log \
                | tail -n 100 \
                || true

              echo '```'
            else
              echo "The performance-test log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload execution log
        if: ${{ always() && env.UPLOAD_LOG_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            reconciliation-performance-${{
              env.ENVIRONMENT
            }}-${{
              env.TEST_DAY
            }}-${{
              github.run_number
            }}
          path: performance-test/performance-test.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9