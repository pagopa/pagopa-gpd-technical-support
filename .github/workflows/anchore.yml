# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, builds an image, performs a container image
# vulnerability scan with Anchore's Grype tool, and integrates the results with GitHub Advanced Security
# code scanning feature.  For more information on the Anchore scan action usage
# and parameters, see https://github.com/anchore/scan-action. For more
# information on Anchore's container image scanning tool Grype, see
# https://github.com/anchore/grype
name: Anchore Container Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '00 07 * * *'

permissions:
  contents: read

env:
  DOCKERFILE: Dockerfile

jobs:
  Anchore-Build-Scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Build the Docker image
        run: docker build . --file ${{ env.DOCKERFILE }} --tag localbuild/testimage:latest

      - name: Scan the Docker image with Anchore
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "localbuild/testimage:latest"
          output-format: sarif
          fail-build: false
          severity-cutoff: "high"

      - name: Validate Anchore SARIF report
        id: validate_sarif
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif }}
        shell: bash
        run: |
          if [[ -z "$SARIF_FILE" || ! -s "$SARIF_FILE" ]]; then
            echo "::error::Anchore did not produce a non-empty SARIF report"
            exit 1
          fi
          jq -e 'type == "object" and .version == "2.1.0" and (.runs | type == "array")' "$SARIF_FILE" >/dev/null

      - name: Upload Anchore Scan Report
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && steps.validate_sarif.outcome == 'success' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
