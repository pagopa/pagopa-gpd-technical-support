microservice-chart:
  namespace: "gps"
  nameOverride: ""
  fullnameOverride: ""
  image:
    repository: ghcr.io/pagopa/pagopa-gpd-technical-support
    tag: "0.0.1-14-PIDM-1995-debt-positions-status-reconciliation"
    pullPolicy: Always
  livenessProbe:
    handlerType: httpGet
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 90
    failureThreshold: 6
    periodSeconds: 10
  readinessProbe:
    handlerType: httpGet
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 90
    failureThreshold: 6
    periodSeconds: 10
  deployment:
    create: true
    replicas: 1
  service:
    create: true
    type: ClusterIP
    ports:
      - 8080
  ingress:
    create: true
    host: "weuuat.gps.internal.uat.platform.pagopa.it"
    path: /gpd-technical-support/(.*)
    servicePort: 8080
  serviceAccount:
    name: "gps-workload-identity"
  azure:
    workloadIdentityClientId: <workload-identity-client-id-set-automatically-by-gha>
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - all
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.25"
    limits:
      memory: "1Gi"
      cpu: "0.50"
  autoscaling:
    enable: true
    minReplica: 1
    maxReplica: 1
    pollingInterval: 10 # seconds
    cooldownPeriod: 50 # seconds
    triggers:
      - type: cpu
        metadata:
          # Required
          type: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          value: "75"
  envConfig:
    APP_NAME: "pagopa-gpd-technical-support"
    APP_ENVIRONMENT: "uat"
    WEBSITE_SITE_NAME: "pagopa-gpd-technical-support"
    CORS_CONFIGURATION: '{"origins": ["*"], "methods": ["*"]}'
    DEFAULT_LOGGING_LEVEL: "INFO"
    APP_LOGGING_LEVEL: "INFO"
    RECONCILIATION_MAX_PROCESSING_WINDOW_DAYS: "7"
    RECONCILIATION_MIN_PROCESSING_DELAY_DAYS: "1"
    RECONCILIATION_REPORT_PARTITION_BUCKETS: "16"
    RECONCILIATION_CANDIDATE_CHUNK_SIZE: "500"
    RECONCILIATION_COSMOS_DATABASE_NAME: "gpd_db"
    RECONCILIATION_COSMOS_RUNS_CONTAINER_NAME: "gpd-reconciliation-runs"
    RECONCILIATION_COSMOS_REPORTS_CONTAINER_NAME: "gpd-reconciliation-reports"
    RECONCILIATION_COSMOS_USE_MANAGED_IDENTITY: "false"
    RECONCILIATION_APD_MAXIMUM_POOL_SIZE: "5"
    RECONCILIATION_APD_MINIMUM_IDLE: "1"
    RECONCILIATION_APD_CONNECTION_TIMEOUT_MS: "30000"
    RECONCILIATION_BIZ_COSMOS_DATABASE_NAME: "db"
    RECONCILIATION_BIZ_COSMOS_CONTAINER_NAME: "biz-events"
    RECONCILIATION_BIZ_COSMOS_USE_MANAGED_IDENTITY: "false"
    RECONCILIATION_COSMOS_ENDPOINT: "https://pagopa-u-weu-gps-cosmos-account.documents.azure.com:443/"
    RECONCILIATION_BIZ_COSMOS_ENDPOINT: "https://pagopa-u-weu-bizevents-ds-cosmos-account.documents.azure.com:443/"
    RECONCILIATION_GPD_PAY_BASE_URL: "https://api.uat.platform.pagopa.it/gpd/api/v1"
    OTEL_SERVICE_NAME: "pagopa-gpd-technical-support"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=uat"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.elastic-system.svc:4317"
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "otlp"
    OTEL_LOGS_EXPORTER: "none"
    OTEL_TRACES_SAMPLER: "always_on"
  envSecret:
    RECONCILIATION_APD_JDBC_URL: "gpd-technical-support-apd-jdbc-url"
    RECONCILIATION_APD_USERNAME: "pgres-gpd-technical-support-user-login"
    RECONCILIATION_APD_PASSWORD: "pgres-gpd-technical-support-user-pwd"
    RECONCILIATION_COSMOS_KEY: "gpd-technical-support-reconciliation-cosmos-key"
    RECONCILIATION_BIZ_COSMOS_KEY: "gpd-technical-support-biz-cosmos-key"
    RECONCILIATION_GPD_PAY_API_KEY: "gpd-technical-support-gpd-pay-subkey"
    # required
    APPLICATIONINSIGHTS_CONNECTION_STRING: 'ai-u-connection-string'
    OTEL_EXPORTER_OTLP_HEADERS: elastic-apm-secret-token
  keyvault:
    name: "pagopa-u-gps-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user
  canaryDelivery:
    create: false
    ingress:
      type: header
      headerName: X-Canary
      headerValue: canary
      weightPercent: 0
    image:
      repository: ghcr.io/pagopa/pagopa-gpd-technical-support
      tag: "0.1.0"
      pullPolicy: Always
    envConfig: {}
    envSecret: {}
