# logging
logging.level.root=INFO
logging.level.it.gov.pagopa=INFO

# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}

# Server
server.servlet.context-path=/
server.port=8080

# Reconciliation
reconciliation.max-processing-window-days=7
reconciliation.min-processing-delay-days=1
reconciliation.report-partition-buckets=16
reconciliation.candidate-chunk-size=500

# Reconciliation Cosmos
reconciliation.cosmos.enabled=false
reconciliation.cosmos.endpoint=https://localhost:8081
reconciliation.cosmos.key=fake-key
reconciliation.cosmos.database-name=gpd_db
reconciliation.cosmos.runs-container-name=gpd-reconciliation-runs
reconciliation.cosmos.reports-container-name=gpd-reconciliation-reports
reconciliation.cosmos.use-managed-identity=false

# GPD Core PAY recovery
reconciliation.gpd-pay.base-url=http://localhost
reconciliation.gpd-pay.api-key=test-api-key
