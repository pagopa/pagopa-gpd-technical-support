# Info
info.application.name=@project.name@
info.application.artifactId=@project.artifactId@
info.application.version=@project.version@
info.application.description=@project.description@
info.properties.environment=${APP_ENVIRONMENT:local}
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Openapi
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Server
server.servlet.context-path=/
server.port=8080
# Logging
logging.level.root=${DEFAULT_LOGGING_LEVEL:INFO}
logging.level.it.gov.pagopa=${APP_LOGGING_LEVEL:INFO}
# CORS configuration
cors.configuration=${CORS_CONFIGURATION:{"origins": ["*"], "methods": ["*"]}}

# Reconciliation
reconciliation.max-processing-window-days=${RECONCILIATION_MAX_PROCESSING_WINDOW_DAYS:7}
reconciliation.min-processing-delay-days=${RECONCILIATION_MIN_PROCESSING_DELAY_DAYS:1}
reconciliation.report-partition-buckets=${RECONCILIATION_REPORT_PARTITION_BUCKETS:16}

# Reconciliation Cosmos
reconciliation.cosmos.enabled=true
reconciliation.cosmos.endpoint=${RECONCILIATION_COSMOS_ENDPOINT:}
reconciliation.cosmos.key=${RECONCILIATION_COSMOS_KEY:}
reconciliation.cosmos.database-name=${RECONCILIATION_COSMOS_DATABASE_NAME:gpd_db}
reconciliation.cosmos.runs-container-name=${RECONCILIATION_COSMOS_RUNS_CONTAINER_NAME:gpd-reconciliation-runs}
reconciliation.cosmos.reports-container-name=${RECONCILIATION_COSMOS_REPORTS_CONTAINER_NAME:gpd-reconciliation-reports}
reconciliation.cosmos.use-managed-identity=${RECONCILIATION_COSMOS_USE_MANAGED_IDENTITY:true}

# Reconciliation PostgreSQL APD
reconciliation.apd.enabled=true
reconciliation.apd.jdbc-url=${RECONCILIATION_APD_JDBC_URL:}
reconciliation.apd.username=${RECONCILIATION_APD_USERNAME:}
reconciliation.apd.password=${RECONCILIATION_APD_PASSWORD:}
reconciliation.apd.maximum-pool-size=${RECONCILIATION_APD_MAXIMUM_POOL_SIZE:5}
reconciliation.apd.minimum-idle=${RECONCILIATION_APD_MINIMUM_IDLE:1}
reconciliation.apd.connection-timeout-ms=${RECONCILIATION_APD_CONNECTION_TIMEOUT_MS:30000}

# Biz+ event lookup
reconciliation.biz.enabled=false
reconciliation.biz.cosmos.endpoint=${RECONCILIATION_BIZ_COSMOS_ENDPOINT:}
reconciliation.biz.cosmos.key=${RECONCILIATION_BIZ_COSMOS_KEY:}
reconciliation.biz.cosmos.database-name=${RECONCILIATION_BIZ_COSMOS_DATABASE_NAME:db}
reconciliation.biz.cosmos.container-name=${RECONCILIATION_BIZ_COSMOS_CONTAINER_NAME:biz-events}
reconciliation.biz.cosmos.use-managed-identity=${RECONCILIATION_BIZ_COSMOS_USE_MANAGED_IDENTITY:false}

# GPD/Core PAY recovery
reconciliation.gpd-pay.enabled=false

