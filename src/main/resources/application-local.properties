# Info
info.properties.environment=local
# Logging
logging.level.root=INFO
logging.level.it.gov.pagopa.gpd.technicalsupport=DEBUG
# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}

# Reconciliation Cosmos containers
reconciliation.cosmos.enabled=false
reconciliation.cosmos.endpoint=${RECONCILIATION_COSMOS_ENDPOINT}
reconciliation.cosmos.key=${RECONCILIATION_COSMOS_KEY}
reconciliation.cosmos.use-managed-identity=${RECONCILIATION_COSMOS_USE_MANAGED_IDENTITY:false}
reconciliation.cosmos.database-name=${RECONCILIATION_COSMOS_DATABASE_NAME:gpd_db}
reconciliation.cosmos.runs-container-name=${RECONCILIATION_COSMOS_RUNS_CONTAINER_NAME:gpd-reconciliation-runs}
reconciliation.cosmos.reports-container-name=${RECONCILIATION_COSMOS_REPORTS_CONTAINER_NAME:gpd-reconciliation-reports}

# APD PostgreSQL connection
reconciliation.apd.jdbc-url=${RECONCILIATION_APD_JDBC_URL}
reconciliation.apd.username=${RECONCILIATION_APD_USERNAME}
reconciliation.apd.password=${RECONCILIATION_APD_PASSWORD}
reconciliation.apd.maximum-pool-size=5
reconciliation.apd.minimum-idle=1
reconciliation.apd.connection-timeout-ms=30000

# Biz+ 
reconciliation.biz.cosmos.endpoint=${RECONCILIATION_BIZ_COSMOS_ENDPOINT}
reconciliation.biz.cosmos.key=${RECONCILIATION_BIZ_COSMOS_KEY}
reconciliation.biz.cosmos.database-name=${RECONCILIATION_BIZ_COSMOS_DATABASE_NAME}
reconciliation.biz.cosmos.container-name=${RECONCILIATION_BIZ_COSMOS_CONTAINER_NAME}
reconciliation.biz.cosmos.use-managed-identity=false

# GPD PAY integration
reconciliation.gpd-pay.base-url=${RECONCILIATION_GPD_PAY_BASE_URL}
reconciliation.gpd-pay.api-key=${RECONCILIATION_GPD_PAY_API_KEY}

# Reconciliation settings
reconciliation.max-processing-window-days=7
reconciliation.min-processing-delay-days=1
reconciliation.report-partition-buckets=16

