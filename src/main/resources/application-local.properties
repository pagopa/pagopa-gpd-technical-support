# Info
info.properties.environment=local
# Logging
logging.level.root=INFO
logging.level.it.gov.pagopa.gpd.technicalsupport=DEBUG
# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}

# Enable real Cosmos run store
reconciliation.cosmos.enabled=true

# Local/Azure Cosmos connection
reconciliation.cosmos.endpoint=${RECONCILIATION_COSMOS_ENDPOINT}
reconciliation.cosmos.key=${RECONCILIATION_COSMOS_KEY}
reconciliation.cosmos.use-managed-identity=${RECONCILIATION_COSMOS_USE_MANAGED_IDENTITY:false}

# Database and containers
reconciliation.cosmos.database-name=${RECONCILIATION_COSMOS_DATABASE_NAME:gpd_db}
reconciliation.cosmos.runs-container-name=${RECONCILIATION_COSMOS_RUNS_CONTAINER_NAME:gpd-reconciliation-runs}
reconciliation.cosmos.reports-container-name=${RECONCILIATION_COSMOS_REPORTS_CONTAINER_NAME:gpd-reconciliation-reports}

# Reconciliation test settings
reconciliation.max-processing-window-days=7
reconciliation.min-processing-delay-days=1
reconciliation.report-partition-buckets=16

