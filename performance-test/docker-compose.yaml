
services:
  apd-preparation:
    build:
      context: .
      dockerfile: Dockerfile.apd-tools
    container_name: gpd-technical-support-apd-preparation
    volumes:
      - '${PWD}/src:/scripts:ro'
      - performance-data:/work
    environment:
      - VARS=/scripts/environments/${env}.environment.json
      - TEST_DAY=${test_day}
      - POSITIONS_TO_CREATE=${positions_to_create}
      - VERBOSE_LOGS=${verbose_logs}
      - ALLOW_FULL_DAY_PURGE=${allow_full_day_purge}
      - APD_PASSWORD=${apd_password}
    entrypoint:
      - /bin/bash
      - /scripts/data-preparation/apd/prepare-test-day.sh
  biz-preparation:
    build:
      context: .
      dockerfile: Dockerfile.biz-tools
    container_name: gpd-technical-support-biz-preparation
    volumes:
      - '${PWD}/src:/scripts:ro'
      - performance-data:/work
    environment:
      - VARS=/scripts/environments/${env}.environment.json
      - POSITIONS_TO_CREATE=${positions_to_create}
      - VERBOSE_LOGS=${verbose_logs}
      - BIZ_COSMOS_KEY=${biz_cosmos_key}
  reconciliation-validation:
    build:
      context: .
      dockerfile: Dockerfile.reconciliation-validator
    container_name: gpd-technical-support-reconciliation-validation
    volumes:
      - '${PWD}/src:/scripts:ro'
      - performance-data:/work
    environment:
      - VARS=/scripts/environments/${env}.environment.json
      - VERBOSE_LOGS=${verbose_logs}
      - RECONCILIATION_COSMOS_KEY=${reconciliation_cosmos_key}
      - EXPECTED_ENVIRONMENT=${env}
      - EXPECTED_TEST_DAY=${test_day}
      - EXPECTED_POSITIONS=${positions_to_create}
      - EXPECTED_EXECUTION_ID=${reconciliation_execution_id:-}
      - EXPECTED_LOGICAL_RUN_KEY=${reconciliation_logical_run_key:-}
  apd-result-validation:
    build:
      context: .
      dockerfile: Dockerfile.apd-tools
    container_name: gpd-technical-support-apd-result-validation
    volumes:
      - '${PWD}/src:/scripts:ro'
      - performance-data:/work
    environment:
      - VARS=/scripts/environments/${env}.environment.json
      - APD_PASSWORD=${apd_password}
      - VERBOSE_LOGS=${verbose_logs}
      - EXPECTED_ENVIRONMENT=${env}
      - EXPECTED_TEST_DAY=${test_day}
      - EXPECTED_POSITIONS=${positions_to_create}
    entrypoint:
      - /bin/bash
      - /scripts/data-validation/apd/validate-reconciliation-result.sh

  apd-local:
    image: postgres:15.17-alpine
    container_name: gpd-technical-support-apd-local
    profiles:
      - local
    environment:
      - POSTGRES_DB=apd
      - POSTGRES_USER=apduser
      - POSTGRES_PASSWORD=${apd_password}
    volumes:
      - apd-local-data:/var/lib/postgresql/data
      - '${PWD}/src/data-preparation/apd/local:/local:ro'
      - '${PWD}/src/data-preparation/apd/local/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apduser -d apd"]
      interval: 2s
      timeout: 3s
      retries: 30

  k6:
    image: grafana/k6@sha256:278d78f2953041b6b4b0bd315e8605ed43222245771adc405f3252f3edea0eef
    container_name: k6
    volumes:
      - '${PWD}/src:/scripts:ro'
    environment:
      - API_SUBSCRIPTION_KEY=${api_subscription_key}
      - APD_PASSWORD=${apd_password}
      - BIZ_COSMOS_KEY=${biz_cosmos_key}
      - RECONCILIATION_COSMOS_KEY=${reconciliation_cosmos_key}
      - TEST_DAY=${test_day}
      - POSITIONS_TO_CREATE=${positions_to_create}
      - VERBOSE_LOGS=${verbose_logs}
      - VARS=/scripts/environments/${env}.environment.json
      - TEST_TYPE=/scripts/test-types/${type}.json
      - K6_OUT=influxdb=http://nginx:8086/${db_name}
    command: run /scripts/${script}.js
    depends_on:
      - nginx

  nginx:
    image: nginx@sha256:0f04e4f646a3f14bf31d8bc8d885b6c951fdcf42589d06845f64d18aec6a3c4d
    container_name: nginx
    volumes:
      - '${PWD}/nginx/${env}.nginx.conf:/etc/nginx/nginx.conf:ro'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  apd-local-data:
  performance-data:
